# Machine-readable label definitions — source of truth.
# Applied by .github/workflows/label-sync.yml (EndBug/label-sync).
# Colors are hex without the leading '#'.

# --- Type ---
- name: "type: article"
  color: "1d76db"
  description: "A new decision / trade-off article"
- name: "type: correction"
  color: "1d76db"
  description: "Fix an inaccuracy or broken link"
- name: "type: enhancement"
  color: "5391d6"
  description: "Improve repo structure, tooling, or templates"
- name: "type: anti-pattern"
  color: "0b4f9c"
  description: "A documented pitfall"
- name: "type: example"
  color: "5391d6"
  description: "A minimal code illustration"
- name: "type: recipe"
  color: "5391d6"
  description: "An end-to-end solution"
- name: "type: question"
  color: "84b6eb"
  description: "A question about content"
- name: "type: rfc"
  color: "0b4f9c"
  description: "Structural change requiring an RFC"

# --- Priority ---
- name: "priority: critical"
  color: "b60205"
  description: "Blocks others or is high-traffic and wrong"
- name: "priority: high"
  color: "d93f0b"
  description: "Pick up soon"
- name: "priority: medium"
  color: "fbca04"
  description: "Normal queue"
- name: "priority: low"
  color: "c5def5"
  description: "Nice to have"

# --- Difficulty ---
- name: "difficulty: starter"
  color: "0e8a16"
  description: "Small, well-scoped"
- name: "difficulty: intermediate"
  color: "a2eeef"
  description: "Requires domain familiarity"
- name: "difficulty: advanced"
  color: "5319e7"
  description: "Deep or cross-cutting expertise"

# --- Status ---
- name: "status: triage"
  color: "fef2c0"
  description: "Newly opened, not yet assessed"
- name: "status: accepted"
  color: "c2e0c6"
  description: "Scope confirmed; ready to work"
- name: "status: in progress"
  color: "fbca04"
  description: "Actively being worked"
- name: "status: needs review"
  color: "d4c5f9"
  description: "Awaiting technical or editorial review"
- name: "status: needs update"
  color: "e99695"
  description: "Merged content that has gone stale"
- name: "status: blocked"
  color: "000000"
  description: "Blocked on a dependency"
- name: "status: on hold"
  color: "cccccc"
  description: "Deliberately paused"

# --- Area ---
- name: "area: foundations"
  color: "006b75"
  description: "00 · Foundations"
- name: "area: core-languages"
  color: "0e7c7b"
  description: "01 · Core Languages"
- name: "area: rendering-frameworks"
  color: "0e7c7b"
  description: "02 · Rendering & Frameworks"
- name: "area: app-architecture"
  color: "128a7d"
  description: "03 · Application Architecture"
- name: "area: interface-engineering"
  color: "128a7d"
  description: "04 · Interface Engineering"
- name: "area: reliability-quality"
  color: "1a998a"
  description: "05 · Reliability & Quality"
- name: "area: engineering-systems"
  color: "1a998a"
  description: "06 · Engineering Systems"
- name: "area: platform-reach"
  color: "20b2aa"
  description: "07 · Platform Reach"
- name: "area: craft-leadership"
  color: "20b2aa"
  description: "08 · Craft & Leadership"
- name: "area: tooling"
  color: "5eb1a8"
  description: "CI, scripts, workflows"
- name: "area: meta"
  color: "5eb1a8"
  description: "Governance, templates, repo docs"

# --- Community & contribution ---
- name: "good first issue"
  color: "7057ff"
  description: "Ideal for first-time contributors"
- name: "help wanted"
  color: "008672"
  description: "Maintainers want help here"
- name: "documentation"
  color: "0075ca"
  description: "Docs about the repo itself"
- name: "community"
  color: "c2e0c6"
  description: "Events, governance, onboarding"
- name: "discussion"
  color: "d876e3"
  description: "Needs conversation before action"

# --- Resolution ---
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Out of scope by decision"
- name: "stale"
  color: "795548"
  description: "Auto-flagged as inactive"
- name: "invalid"
  color: "e6e6e6"
  description: "Not actionable as reported"
