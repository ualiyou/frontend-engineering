# Auto-applies area/type labels to PRs by changed path (rules in .github/labeler.yml).
# WHY: routes PRs to the right domain maintainer without manual triage.
name: Auto label

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
