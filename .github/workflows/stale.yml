# Nudges and eventually closes abandoned issues/PRs so the queue reflects reality.
# WHY: a backlog full of dead threads hides the work that actually needs attention.
name: Stale

on:
  schedule:
    - cron: "30 1 * * *"   # daily 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "status: accepted,status: in progress,priority: critical,priority: high,help wanted,type: rfc"
          exempt-pr-labels: "status: in progress,status: needs review"
          stale-issue-message: >
            This issue has had no activity for 45 days. It will be closed in 14 days
            if there is no further activity. Comment to keep it open — no offense meant;
            this just keeps the queue honest.
          stale-pr-message: >
            This pull request has been inactive for 45 days and will be closed in 14
            days. Push a commit or comment to keep it open. It can always be reopened.
          close-issue-message: "Closing due to inactivity. Reopen anytime — the idea isn't lost."
          close-pr-message: "Closing due to inactivity. Reopen when you're ready to continue."
