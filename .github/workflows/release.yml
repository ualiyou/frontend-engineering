# Cuts a GitHub Release when a version tag is pushed, with auto-generated notes.
# WHY: content ships as versioned, citable snapshots (see .github/MILESTONES.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Frontend Engineering ${{ github.ref_name }}"
          body: |
            A versioned snapshot of the Frontend Engineering knowledge base.
            See CHANGELOG and the milestone this tag closes in `.github/MILESTONES.md`.
